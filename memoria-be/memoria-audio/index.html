<!DOCTYPE html>
<html>
<head>
    <title>Mic Test</title>
</head>
<body style="font-family: sans-serif; padding: 50px; text-align: center;">
    <h2>Test Live Microphone</h2>

    <div id="micBtn" title="Start recording" style="width:64px;height:64px;border-radius:50%;background:#eafbf0;border:2px solid #27a660;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:32px auto;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <rect x="9" y="2" width="6" height="11" rx="3" fill="#22c55e"/>
            <path d="M5 11a7 7 0 0 0 14 0" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
            <line x1="12" y1="18" x2="12" y2="22" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
            <line x1="8" y1="22" x2="16" y2="22" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </div>

    <div id="actionBtns" style="display:none;gap:24px;justify-content:center;margin:32px auto;">
        <button id="cancelBtn" title="Cancel" style="width:48px;height:48px;border-radius:50%;background:#fff0f0;border:1.5px solid #ef4444;display:flex;align-items:center;justify-content:center;cursor:pointer;">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><line x1="4" y1="4" x2="14" y2="14" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round"/><line x1="14" y1="4" x2="4" y2="14" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <button id="sendBtn" title="Send to backend" style="width:48px;height:48px;border-radius:50%;background:#eafbf0;border:1.5px solid #22c55e;display:flex;align-items:center;justify-content:center;cursor:pointer;">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><polyline points="3,10 8,15 17,5" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
    </div>

    <p id="status" style="color:gray;">Ready...</p>
    <h3 id="result" style="color:green;"></h3>

    <script>
        let mediaRecorder, audioChunks = [], audioBlob = null;
        const micBtn = document.getElementById('micBtn');
        const actionBtns = document.getElementById('actionBtns');
        const cancelBtn = document.getElementById('cancelBtn');
        const sendBtn = document.getElementById('sendBtn');
        const statusText = document.getElementById('status');
        const resultText = document.getElementById('result');
        let pulseInterval = null;

        // ── Silence timeout variables ─────────────────────────────────────────
        const SILENCE_THRESHOLD = 0.01;  // amplitude below this = silence (0.0–1.0 scale)
        const SILENCE_TIMEOUT_MS = 30000; // 30 seconds of continuous silence → reset
        let audioContext = null;
        let analyser = null;
        let silenceTimer = null;         // holds the setTimeout reference
        let silenceCheckInterval = null; // holds the setInterval reference for polling

        function startSilenceDetection(stream) {
            // Web Audio API — reads raw amplitude from the mic stream every 500ms
            audioContext = new AudioContext();
            analyser = audioContext.createAnalyser();
            const source = audioContext.createMediaStreamSource(stream);
            source.connect(analyser);
            analyser.fftSize = 256;
            const dataArray = new Uint8Array(analyser.frequencyBinCount);

            silenceCheckInterval = setInterval(() => {
                analyser.getByteTimeDomainData(dataArray);
                // Each byte is 0–255, silence sits at 128 (midpoint)
                // Subtract 128 and normalise to get amplitude in 0.0–1.0 range
                const amplitude = Math.max(...dataArray.map(v => Math.abs(v - 128))) / 128;

                if (amplitude < SILENCE_THRESHOLD) {
                    // Silence detected — start the 30s countdown if not already running
                    if (!silenceTimer) {
                        silenceTimer = setTimeout(() => {
                            // 30s of continuous silence passed → auto-cancel
                            resetToIdle();
                            statusText.innerText = 'No voice detected for 30s. Recording cancelled.';
                        }, SILENCE_TIMEOUT_MS);
                    }
                } else {
                    // Voice detected — cancel any running countdown
                    if (silenceTimer) {
                        clearTimeout(silenceTimer);
                        silenceTimer = null;
                    }
                }
            }, 500); // check every 500ms
        }

        function stopSilenceDetection() {
            clearInterval(silenceCheckInterval);
            clearTimeout(silenceTimer);
            silenceCheckInterval = null;
            silenceTimer = null;
            if (audioContext) {
                audioContext.close();
                audioContext = null;
                analyser = null;
            }
        }

        // Resets all UI and state back to the initial idle state
        function resetToIdle() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
                mediaRecorder.onstop = () => {}; // detach handler so it doesn't fire
                mediaRecorder.stop();
            }
            stopSilenceDetection();
            stopPulse();
            audioBlob = null;
            audioChunks = [];
            actionBtns.style.display = 'none';
            micBtn.style.display = 'flex';
        }
        // ─────────────────────────────────────────────────────────────────────

        function startPulse() {
            let on = false;
            pulseInterval = setInterval(() => {
                on = !on;
                micBtn.style.boxShadow = on ? '0 0 0 8px rgba(34,197,94,0.2)' : 'none';
            }, 600);
        }

        function stopPulse() {
            clearInterval(pulseInterval);
            micBtn.style.boxShadow = 'none';
        }

        micBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                audioBlob = null;

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };
                mediaRecorder.onstop = () => {
                    audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                };

                mediaRecorder.start();
                micBtn.style.display = 'none';
                actionBtns.style.display = 'flex';
                startPulse();
                startSilenceDetection(stream); // ← silence detection starts with recording
                statusText.innerText = 'Recording... Speak into your mic!';
                resultText.innerText = '';
            } catch (err) {
                alert('Microphone access denied or not found.');
            }
        });

        cancelBtn.addEventListener('click', () => {
            resetToIdle(); // ← reuses same reset logic
            statusText.innerText = 'Cancelled.';
            resultText.innerText = '';
        });

        sendBtn.addEventListener('click', async () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
                mediaRecorder.stop();
                await new Promise(r => mediaRecorder.addEventListener('stop', r, { once: true }));
            }
            stopSilenceDetection(); // ← stop monitoring when user manually sends
            stopPulse();
            actionBtns.style.display = 'none';
            micBtn.style.display = 'flex';
            statusText.innerText = 'Processing audio with Gemini...';

            if (!audioBlob) return;

            const formData = new FormData();
            formData.append('audio', audioBlob, 'recording.webm');

            try {
                const response = await fetch('http://localhost:3001/transcribe', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                statusText.innerText = 'Done!';
                resultText.innerText = 'Transcript: ' + data.transcript;
            } catch (err) {
                statusText.innerText = 'Error uploading file.';
                console.error(err);
            }
        });
    </script>
</body>
</html>
